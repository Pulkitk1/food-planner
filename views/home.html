    <header class="greeting">
      <h1 id="greeting">Hello</h1>
      <p class="eyebrow" id="today-date"></p>
      <p class="trial-note" id="trial-note" hidden>
        <a id="trial-note-link" href="/w/{{key}}/profile#account"></a>
        <button class="trial-note-x" id="trial-note-x" type="button" aria-label="Hide this for today">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </p>
    </header>

    <section aria-labelledby="plan-heading">
      <h2 id="plan-heading">Today’s plan</h2>
      <ul class="meals" id="meals" aria-live="polite"></ul>
      <div class="totals" id="totals" hidden></div>
    </section>

    <p class="status" id="status">
      <span class="dot" id="status-dot" aria-hidden="true"></span>
      <span id="status-text">Checking Claude…</span>
    </p>

    <button class="btn btn-block" id="tell-cook" type="button">Tell your cook</button>
    <p class="copied" id="copied" role="status" aria-live="polite"></p>
